<div>
    <h1>Film Catalog</h1>
    <button (click)="isOnlyFavorites.set(!isOnlyFavorites())">
        {{ isOnlyFavorites() ? 'Show All' : 'Show Favorites' }}
    </button>
    @for (film of films(); track film.id) {
        <div>
            <h2>{{ film.title }}</h2>
            <p>Year: {{ film.year }}</p>
            <p>Genre: {{ film.genre }}</p>
            <p>Rating: {{ film.rating }}</p>
            <!-- <p>Duration: {{ film.duration }} minutes</p>
            <p>{{ film.description }}</p> -->
            <img [src]="film.posterUrl" [alt]="film.title">
            <button (click)="toggleFavorite(film.id)">fav</button>
        </div>
    }
</div>
